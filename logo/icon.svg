<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70 -70 140 140" width="140" height="140" role="img" aria-label="Xenium Designs icon">
  <!-- Xenium Designs icon badge: gradient ring + data-lattice X + chevrons -->
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#ec4899"/>
      <stop offset="0.5"  stop-color="#a855f7"/>
      <stop offset="1"    stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <circle r="62" fill="#0a0a0f"/>
  <circle r="62" fill="none" stroke="url(#grad)" stroke-width="7"/>
  <g fill="none" stroke="url(#edge)" stroke-width="2" stroke-linecap="round">
    <line x1="-30" y1="26" x2="-6"  y2="2"/>
    <line x1="6"  y1="-2" x2="30"  y2="-26"/>
    <line x1="-18" y1="18" x2="18" y2="-18"/>
    <circle cx="-18" cy="18" r="2.5"/>
    <circle cx="18"  cy="-18" r="2.5"/>
  </g>
  <g stroke="url(#grad)" stroke-width="9" stroke-linecap="round">
    <line x1="-22" y1="-24" x2="22" y2="24"/>
    <line x1="22"  y1="-24" x2="-22" y2="24"/>
  </g>
</svg>
